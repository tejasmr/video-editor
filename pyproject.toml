[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editor"
version = "1.0.0"
description = "Deterministic video editing tools and agentic skills for splitting and merging videos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
]

[project.scripts]
video-split = "scripts.split_video:main"
video-merge = "scripts.merge_videos:main"
video-probe = "scripts.probe_video:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_tools*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
